<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <h2>CURRENT TIME</h2>
    </header>
    <main>
        <div class="container">
            <div class="digitalclock">
                <h3 id="weekday">
                    MON
                </h3>
                <h3 id="hour">
                    12
                </h3>
                <h3 id="c1">
                    :
                </h3>
                <h3 id="minute">
                    59
                </h3>
                <h3 id="c2">
                    :
                </h3>
                <h3 id="second">
                    59
                </h3>
                <h3 id="ampm">
                    AM
                </h3>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="cyear"></span> Quentin Gangle</p>
    </footer>
</body>
</html>
<script src="js/digitalclock.js"></script>
